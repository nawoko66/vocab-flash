<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC対策</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f5f5f3;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; text-align: center; margin: 8px 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; padding: 10px 8px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; color: #222; }
  .tab.active { background: #222; color: #fff; border-color: #222; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    color: #222;
  }
  button:active { background: #eee; }
  .progress { text-align: center; font-size: 13px; color: #777; margin-bottom: 10px; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 24px 20px;
    min-height: 160px;
  }
  .word { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  .meaning { font-size: 16px; color: #444; margin: 0 0 12px; }
  .example { font-size: 13px; color: #888; line-height: 1.5; margin: 0; }
  .hint { font-size: 12px; color: #aaa; margin-top: 14px; }
  .nav { display: flex; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .know { color: #1a7a4c; }
  .dont { color: #c23b3b; }
  .reveal-btn { background: #eef4ff; border-color: #b7d0ff; margin-bottom: 12px; }
  .question { font-size: 16px; font-weight: 600; margin: 0 0 16px; line-height: 1.5; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
  }
  .choice.correct { background: #e6f7ee; border-color: #1a7a4c; color: #1a7a4c; }
  .choice.wrong { background: #fdecec; border-color: #c23b3b; color: #c23b3b; }
  .explanation {
    font-size: 13px;
    color: #555;
    line-height: 1.5;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .tips-toggle { background: #fff7e6; border-color: #f0d78c; }
  .tip-card { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .tip-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .tip-date { font-size: 11px; color: #999; margin: 0 0 10px; }
  .tip-card h4 { font-size: 14px; margin: 14px 0 6px; }
  .tip-card h4:first-of-type { margin-top: 0; }
  .tip-card p, .tip-card li { font-size: 13px; line-height: 1.6; color: #333; }
  .tip-card p { margin: 6px 0; }
  .tip-card ul, .tip-card ol { margin: 6px 0; padding-left: 20px; }
  .tip-card table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .tip-card th, .tip-card td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; }
  .tip-card .note-meta { font-size: 12px; color: #999; margin-top: -6px; }
  .tip-card .note-practice { font-size: 12px; color: #666; background: #f7f7f5; padding: 8px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
<h1>TOEIC対策</h1>
<div class="tabs">
  <button id="tabWords" class="tab active">単語</button>
  <button id="tabGrammar" class="tab">文法</button>
</div>

<div id="wordsSection">
  <div class="controls">
    <select id="weekFilter" style="flex:1;min-width:80px;padding:10px 8px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px;color:#222;">
      <option value="all">全部</option>
    </select>
  </div>
  <div class="controls">
    <button id="modeCard">カード</button>
    <button id="modeQuiz">クイズ</button>
    <button id="modeWrite">英作文</button>
    <button id="shuffleBtn">シャッフル</button>
  </div>
  <div class="progress" id="progress"></div>
  <div id="stage"></div>
  <div class="nav">
    <button id="prevBtn">← 前へ</button>
    <div id="quizControls" style="display:none;gap:8px;flex:2;">
      <button id="knowBtn" class="know" style="flex:1">覚えた</button>
      <button id="dontBtn" class="dont" style="flex:1">まだ</button>
    </div>
    <button id="nextBtn">次へ →</button>
  </div>
</div>

<div id="grammarSection" style="display:none;">
  <div class="controls">
    <button id="rulesToggle" class="tips-toggle">🧠 覚えるポイント</button>
    <button id="tipsToggle" class="tips-toggle">📘 文法TIPS</button>
  </div>
  <div id="rulesPanel" style="display:none;margin-bottom:12px;"></div>
  <div id="tipsPanel" style="display:none;margin-bottom:12px;"></div>
  <div class="controls">
    <button id="gShuffleBtn">シャッフル</button>
    <button id="gResetBtn">スコアをリセット</button>
  </div>
  <div class="progress" id="gProgress"></div>
  <div id="gStage"></div>
  <div class="nav">
    <button id="gPrevBtn">← 前へ</button>
    <button id="gNextBtn">次へ →</button>
  </div>
</div>
</div>
<script>
let allWords = [];
let words = [];
let idx = 0, mode = "card", results = {};
let writeInputs = {}, writeResults = {};
const stage = document.getElementById("stage");
const progress = document.getElementById("progress");

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.,!?;:'"]+$/, "");
}

let grammarQuestions = [];
let gIdx = 0, gResults = {};
const gStage = document.getElementById("gStage");
const gProgress = document.getElementById("gProgress");

let tips = [];
function renderTips() {
  const panel = document.getElementById("tipsPanel");
  if (!tips.length) {
    panel.innerHTML = '<div class="tip-card"><p>TIPSはまだありません。</p></div>';
    return;
  }
  panel.innerHTML = tips.slice().reverse().map(function (t) {
    return '<div class="tip-card"><p class="tip-title">' + t.title + '</p><p class="tip-date">' + t.date + '</p>' + t.html + '</div>';
  }).join("");
}

let rules = [];
function renderRules() {
  const panel = document.getElementById("rulesPanel");
  if (!rules.length) {
    panel.innerHTML = '<div class="tip-card"><p>覚えるポイントはまだありません。</p></div>';
    return;
  }
  panel.innerHTML = rules.map(function (r) {
    return '<div class="tip-card"><p class="tip-title">' + r.title + '</p>' + r.html + '</div>';
  }).join("");
}

let tab = "words";

function renderCard() {
  const { word: w, meaning: m, example: ex, exampleJa: exj } = words[idx];
  stage.innerHTML =
    '<div class="card" id="flipZone">' +
    '<p class="word">' + w + '</p>' +
    '<p class="meaning" id="meaning" style="display:none">' + m + '</p>' +
    '<p class="example" id="exWrap">' + ex + '<br>' + exj + '</p>' +
    '<p class="hint">タップして意味を表示</p>' +
    '</div>';
  document.getElementById("flipZone").onclick = function () {
    const el = document.getElementById("meaning");
    el.style.display = el.style.display === "none" ? "block" : "none";
  };
  document.getElementById("quizControls").style.display = "none";
  progress.textContent = (idx + 1) + " / " + words.length;
}

function renderQuiz() {
  const { word: w, meaning: m, example: ex, exampleJa: exj } = words[idx];
  const st = results[idx];
  stage.innerHTML =
    '<div class="card">' +
    '<p class="word">' + w + '</p>' +
    '<button class="reveal-btn" id="revealBtn">意味を見る</button>' +
    '<p class="meaning" id="meaning" style="display:none">' + m + '</p>' +
    '<p class="example" id="exWrap" style="display:none">' + ex + '<br>' + exj + '</p>' +
    (st ? '<p class="hint ' + (st === "know" ? "know" : "dont") + '">前回: ' + (st === "know" ? "覚えた" : "まだ") + '</p>' : '') +
    '</div>';
  document.getElementById("revealBtn").onclick = function () {
    document.getElementById("meaning").style.display = "block";
    document.getElementById("exWrap").style.display = "block";
  };
  document.getElementById("quizControls").style.display = "flex";
  const known = Object.values(results).filter(function (v) { return v === "know"; }).length;
  progress.textContent = (idx + 1) + " / " + words.length + "　覚えた: " + known;
}

function renderWrite() {
  const { word: w, meaning: m, example: ex, exampleJa: exj } = words[idx];
  const done = writeResults[idx] !== undefined;
  stage.innerHTML =
    '<div class="card">' +
    '<p class="hint">次の文を英語にしてください</p>' +
    '<p class="meaning">' + exj + '</p>' +
    '<textarea id="answerInput" rows="3" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;" placeholder="英語で入力">' + (writeInputs[idx] || "") + '</textarea>' +
    '<button class="reveal-btn" id="checkBtn" style="margin-top:8px;">判定</button>' +
    (done ?
      '<p class="hint ' + (writeResults[idx] ? "know" : "dont") + '">' + (writeResults[idx] ? "一致しました" : "正解と一致しませんでした") + '</p>' +
      '<p class="example">正解例: ' + ex + '</p>' +
      '<p class="word" style="font-size:14px;margin-top:8px;">単語: ' + w + '</p>'
      : "") +
    '</div>';
  document.getElementById("checkBtn").onclick = function () {
    const input = document.getElementById("answerInput").value;
    writeInputs[idx] = input;
    writeResults[idx] = normalize(input) === normalize(ex);
    renderWrite();
  };
  document.getElementById("answerInput").oninput = function (e) { writeInputs[idx] = e.target.value; };
  document.getElementById("quizControls").style.display = "none";
  const answered = Object.keys(writeResults).length;
  const correct = Object.values(writeResults).filter(Boolean).length;
  progress.textContent = (idx + 1) + " / " + words.length + "　正解: " + correct + " / " + answered;
}

function renderWords() {
  if (!words.length) { stage.innerHTML = '<div class="card"><p class="word">この週の単語はまだありません。</p></div>'; progress.textContent = ""; return; }
  if (mode === "card") renderCard();
  else if (mode === "quiz") renderQuiz();
  else renderWrite();
}

function populateWeekFilter() {
  const weeks = Array.from(new Set(allWords.map(function (w) { return w.week; }).filter(function (w) { return w !== undefined; })))
    .sort(function (a, b) { return a - b; });
  const sel = document.getElementById("weekFilter");
  weeks.forEach(function (w) {
    const opt = document.createElement("option");
    opt.value = String(w);
    opt.textContent = "第" + w + "週";
    sel.appendChild(opt);
  });
}

function applyWeekFilter() {
  const val = document.getElementById("weekFilter").value;
  words = val === "all" ? allWords.slice() : allWords.filter(function (w) { return String(w.week) === val; });
  idx = 0;
  results = {};
  writeInputs = {};
  writeResults = {};
}

function renderGrammar() {
  if (!grammarQuestions.length) {
    gStage.innerHTML = '<div class="card"><p class="question">文法問題がまだありません。</p></div>';
    gProgress.textContent = "";
    return;
  }
  const q = grammarQuestions[gIdx];
  const answered = gResults[gIdx] !== undefined;
  gStage.innerHTML =
    '<div class="card">' +
    '<p class="question">' + (gIdx + 1) + '. ' + q.question + '</p>' +
    q.choices.map(function (choice, i) {
      let cls = "choice";
      if (answered) {
        if (i === q.answer) cls += " correct";
        else if (i === gResults[gIdx]) cls += " wrong";
      }
      return '<button class="' + cls + '" data-i="' + i + '">' + choice + '</button>';
    }).join("") +
    (answered && q.explanation ? '<p class="explanation">' + q.explanation + '</p>' : '') +
    '</div>';

  gStage.querySelectorAll(".choice").forEach(function (btn) {
    btn.onclick = function () {
      if (gResults[gIdx] !== undefined) return;
      gResults[gIdx] = Number(btn.dataset.i);
      renderGrammar();
    };
  });

  const answeredCount = Object.keys(gResults).length;
  const correctCount = Object.keys(gResults).filter(function (k) { return gResults[k] === grammarQuestions[k].answer; }).length;
  gProgress.textContent = (gIdx + 1) + " / " + grammarQuestions.length + "　正解: " + correctCount + " / " + answeredCount;
}

function switchTab(t) {
  tab = t;
  document.getElementById("wordsSection").style.display = t === "words" ? "" : "none";
  document.getElementById("grammarSection").style.display = t === "grammar" ? "" : "none";
  document.getElementById("tabWords").classList.toggle("active", t === "words");
  document.getElementById("tabGrammar").classList.toggle("active", t === "grammar");
  t === "words" ? renderWords() : renderGrammar();
}

document.getElementById("tabWords").onclick = function () { switchTab("words"); };
document.getElementById("tabGrammar").onclick = function () { switchTab("grammar"); };

document.getElementById("weekFilter").onchange = function () { applyWeekFilter(); renderWords(); };
document.getElementById("modeCard").onclick = function () { mode = "card"; renderWords(); };
document.getElementById("modeQuiz").onclick = function () { mode = "quiz"; renderWords(); };
document.getElementById("modeWrite").onclick = function () { mode = "write"; renderWords(); };
document.getElementById("prevBtn").onclick = function () { idx = (idx - 1 + words.length) % words.length; renderWords(); };
document.getElementById("nextBtn").onclick = function () { idx = (idx + 1) % words.length; renderWords(); };
document.getElementById("knowBtn").onclick = function () { results[idx] = "know"; idx = (idx + 1) % words.length; renderWords(); };
document.getElementById("dontBtn").onclick = function () { results[idx] = "dont"; idx = (idx + 1) % words.length; renderWords(); };
document.getElementById("shuffleBtn").onclick = function () {
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [words[i], words[j]] = [words[j], words[i]];
  }
  idx = 0;
  renderWords();
};

document.getElementById("tipsToggle").onclick = function () {
  const panel = document.getElementById("tipsPanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
};

document.getElementById("rulesToggle").onclick = function () {
  const panel = document.getElementById("rulesPanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
};

document.getElementById("gPrevBtn").onclick = function () { gIdx = (gIdx - 1 + grammarQuestions.length) % grammarQuestions.length; renderGrammar(); };
document.getElementById("gNextBtn").onclick = function () { gIdx = (gIdx + 1) % grammarQuestions.length; renderGrammar(); };
document.getElementById("gResetBtn").onclick = function () { gResults = {}; renderGrammar(); };
document.getElementById("gShuffleBtn").onclick = function () {
  for (let i = grammarQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [grammarQuestions[i], grammarQuestions[j]] = [grammarQuestions[j], grammarQuestions[i]];
  }
  gIdx = 0;
  gResults = {};
  renderGrammar();
};

fetch("words.json")
  .then(function (res) { return res.json(); })
  .then(function (data) {
    allWords = data;
    populateWeekFilter();
    applyWeekFilter();
    if (tab === "words") renderWords();
  })
  .catch(function (err) {
    stage.innerHTML = '<div class="card"><p class="word">読み込みエラー</p><p class="example">words.jsonの読み込みに失敗しました。サーバー経由で開いてください。</p></div>';
    console.error(err);
  });

fetch("grammar.json")
  .then(function (res) { return res.json(); })
  .then(function (data) {
    grammarQuestions = data;
    if (tab === "grammar") renderGrammar();
  })
  .catch(function (err) {
    console.error(err);
  });

fetch("tips.json")
  .then(function (res) { return res.json(); })
  .then(function (data) {
    tips = data;
    renderTips();
  })
  .catch(function (err) {
    console.error(err);
  });

fetch("rules.json")
  .then(function (res) { return res.json(); })
  .then(function (data) {
    rules = data;
    renderRules();
  })
  .catch(function (err) {
    console.error(err);
  });
</script>
</body>
</html>
